<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBW Dashboard Hub</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0a1626;
    color: #e7eef7;
    min-height: 100vh;
  }

  /* ── CEVA × BBW Header (from project template) ───────────────── */
  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    background: linear-gradient(115deg, #0a1626 0%, #0f2447 55%, #1b3d7a 100%);
    padding: 24px 28px 26px;
    position: relative;
  }
  .site-header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, #e2231a 0 50%, #6f9be0 50% 100%);
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .partner { display: flex; align-items: center; gap: 14px; }
  .partner .x { width: 1px; height: 38px; background: #2a4a73; }
  .logo-ceva { height: 38px; width: auto; display: block; }
  .logo-bbw  { height: 52px; width: auto; display: block; }
  .brand .divider { width: 1px; align-self: stretch; background: #2a4a73; margin: 0 4px; }
  .brand h1 { font-size: 21px; font-weight: 800; color: #fff; }
  .brand .sub { color: #93a8c4; font-size: 13px; margin-top: 4px; }

  /* sign-out button in the header */
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-chip {
    font-size: 13px;
    color: #93a8c4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
  .btn-signout {
    background: transparent;
    border: 1px solid #2a4a73;
    color: #93a8c4;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn-signout:hover { background: #2a4a73; color: #e7eef7; }

  @media (max-width: 600px) {
    .site-header { padding: 18px 16px; }
    .logo-ceva { height: 30px; }
    .logo-bbw  { height: 42px; }
  }

  /* ── Gingham background tile ──────────────────────────────────── */
  /* Pink-on-white gingham, overlaid dark for the dark theme */
  .gingham-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #0a1626;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 29px,
        rgba(111,155,224,.07) 29px,
        rgba(111,155,224,.07) 30px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 29px,
        rgba(111,155,224,.07) 29px,
        rgba(111,155,224,.07) 30px
      );
  }

  /* ── Screens ──────────────────────────────────────────────────── */
  .screen { position: relative; z-index: 1; }

  /* Sign-in screen */
  #sign-in-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 90px);
    padding: 40px 20px;
  }
  .sign-in-card {
    background: linear-gradient(145deg, #0f2447, #1b3d7a22);
    border: 1px solid #2a4a73;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,.45);
  }
  .sign-in-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .sign-in-card p  { color: #93a8c4; font-size: 14px; margin-bottom: 28px; }

  .input-group { margin-bottom: 16px; text-align: left; }
  .input-group label { display: block; font-size: 12px; color: #93a8c4; margin-bottom: 6px; letter-spacing: .05em; text-transform: uppercase; }
  .input-group input {
    width: 100%;
    padding: 11px 14px;
    background: #0a1626;
    border: 1px solid #2a4a73;
    border-radius: 8px;
    color: #e7eef7;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .input-group input:focus { border-color: #6f9be0; }

  .btn-primary {
    width: 100%;
    padding: 13px;
    background: linear-gradient(90deg, #e2231a, #c41e16);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .88; }

  .sign-in-error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 14px;
    min-height: 20px;
    display: none;
  }
  .sign-in-error.visible { display: block; }

  /* Loading spinner */
  #loading-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 90px);
  }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid #2a4a73;
    border-top-color: #6f9be0;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hub screen */
  #hub-screen {
    padding: 36px 28px 60px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .hub-intro {
    margin-bottom: 32px;
  }
  .hub-intro h2 {
    font-size: 20px;
    font-weight: 700;
    color: #e7eef7;
    margin-bottom: 6px;
  }
  .hub-intro p { color: #93a8c4; font-size: 14px; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }

  /* ── Dashboard card ───────────────────────────────────────────── */
  .dash-card {
    background: linear-gradient(145deg, #0f2447, #0d1e3a);
    border: 1px solid #2a4a73;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .dash-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 36px rgba(0,0,0,.5);
    border-color: #6f9be0;
  }

  .card-accent { height: 5px; }
  .accent-red  { background: linear-gradient(90deg, #e2231a, #ff5a54); }
  .accent-blue { background: linear-gradient(90deg, #1b3d7a, #6f9be0); }
  .accent-pink { background: linear-gradient(90deg, #c94080, #f06fa0); }

  .card-body { padding: 22px 22px 18px; flex: 1; }
  .card-icon {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: #e7eef7;
    margin-bottom: 7px;
  }
  .card-desc {
    font-size: 13px;
    color: #93a8c4;
    line-height: 1.55;
  }

  .card-footer {
    padding: 12px 22px;
    border-top: 1px solid #1e3560;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #6f9be0;
  }
  .card-footer .badge {
    background: #1e3560;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: #93a8c4;
  }
  .card-arrow { font-size: 16px; }

  /* Forgot password link & reset sub-view */
  .forgot-link {
    display: block;
    margin-top: 14px;
    font-size: 13px;
    color: #6f9be0;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
  }
  .forgot-link:hover { color: #93b8e8; }

  #reset-view { display: none; }
  #reset-view.visible { display: block; }

  .reset-msg {
    font-size: 13px;
    margin-top: 12px;
    min-height: 20px;
  }
  .reset-msg.success { color: #5dd88a; }
  .reset-msg.error   { color: #ff6b6b; }

  .back-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    color: #93a8c4;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
  }
  .back-link:hover { color: #e7eef7; }

  /* No-access message */
  .no-access {
    text-align: center;
    padding: 60px 20px;
    color: #93a8c4;
  }
  .no-access h3 { font-size: 18px; color: #e7eef7; margin-bottom: 10px; }
  .no-access p  { font-size: 14px; }

  @media (max-width: 600px) {
    #hub-screen { padding: 24px 16px 40px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

    <span class="user-chip" id="user-email"></span>
    <button class="btn-signout" id="btn-signout">Sign out</button>
  </div>
</header>

<!-- ── Loading ─────────────────────────────────────────────────────── -->
<div id="loading-screen" class="screen">
  <div class="spinner"></div>
</div>

<!-- ── Sign-in ──────────────────────────────────────────────────────── -->
<div id="sign-in-screen" class="screen" style="display:none">
  <div class="sign-in-card">
    <h2>Welcome Back</h2>
    <p>Sign in with your authorized CEVA email address.</p>
    <div class="input-group">
      <label for="email-input">Email</label>
      <input type="email" id="email-input" placeholder="you@cevalogistics.com" autocomplete="email">
    </div>
    <div class="input-group">
      <label for="password-input">Password</label>
      <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-signin">Sign In</button>
    <div class="sign-in-error" id="sign-in-error"></div>
    <button class="forgot-link" id="forgot-link">Forgot password?</button>

    <!-- Password reset sub-view (hidden until "Forgot password?" is clicked) -->
    <div id="reset-view">
      <hr style="border-color:#2a4a73;margin:20px 0">
      <p style="font-size:14px;color:#93a8c4;margin-bottom:14px;">
        Enter your email and we'll send you a link to reset your password.
      </p>
      <div class="input-group">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" placeholder="you@cevalogistics.com" autocomplete="email">
      </div>
      <button class="btn-primary" id="btn-send-reset">Send Reset Link</button>
      <div class="reset-msg" id="reset-msg"></div>
      <button class="back-link" id="back-to-signin">← Back to sign in</button>
    </div>
  </div>
</div>

<!-- ── Hub ──────────────────────────────────────────────────────────── -->
<div id="hub-screen" class="screen" style="display:none">
  <div id="hub-intro" class="hub-intro">
    <h2>Operations Dashboards</h2>
    <p>Select a dashboard below. You only see the ones you have access to.</p>
  </div>
  <div class="cards-grid" id="cards-grid"></div>
</div>


<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// CONFIGURATION — replace these values with your actual Firebase project config
// ─────────────────────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAEapIrGhOcpKuxCv-oIndQ3UD3q8PiYs0",
  authDomain:        "bbw-hub.firebaseapp.com",
  databaseURL:       "https://bbw-hub-default-rtdb.firebaseio.com",
  projectId:         "bbw-hub",
  storageBucket:     "bbw-hub.firebasestorage.app",
  messagingSenderId: "447861225810",
  appId:             "1:447861225810:web:aafa4fc47e34721db3228b"
};

// ─────────────────────────────────────────────────────────────────────────────
// DASHBOARD REGISTRY
// Add new dashboards here. "key" matches a field in the user's Firebase record.
// ─────────────────────────────────────────────────────────────────────────────
const DASHBOARDS = [
  {
    key:     "daily_output",
    title:   "Daily Output",
    desc:    "LTFC reaches, outbound cartons, and shift-by-shift scorecard data. Updated each shift by supervisors.",
    icon:    "📦",
    accent:  "accent-red",
    badge:   "Live",
    url:     "https://cevabbw.github.io/mcdonough/"
  },
  {
    key:     "picker_productivity",
    title:   "LTFC Picker Productivity",
    desc:    "Reaches and units picked by hour, associate leaderboard (Active-Batch & Active-Discrete), and shift totals.",
    icon:    "⚡",
    accent:  "accent-blue",
    badge:   "Live · 15-min refresh",
    url:     "https://cevabbw.github.io/bbw-picker-dashboard/"
  }
  // Add more dashboards here as they go live:
  // { key: "another_dash", title: "...", desc: "...", icon: "🗂️", accent: "accent-pink", badge: "...", url: "..." }
];

// ─────────────────────────────────────────────────────────────────────────────
// Firebase imports (loaded from CDN — no install needed)
// ─────────────────────────────────────────────────────────────────────────────
import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword,
         signOut, onAuthStateChanged,
         sendPasswordResetEmail }               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get }                from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ─────────────────────────────────────────────────────────────────────────────
// Bootstrap
// ─────────────────────────────────────────────────────────────────────────────
const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getDatabase(app);

// UI refs
const screens = {
  loading: document.getElementById("loading-screen"),
  signIn:  document.getElementById("sign-in-screen"),
  hub:     document.getElementById("hub-screen")
};

function show(which) {
  Object.entries(screens).forEach(([k, el]) => {
    el.style.display = k === which ? "" : "none";
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Auth state listener — this runs every time the page loads or auth changes
// ─────────────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById("header-right").style.display = "none";
    show("signIn");
    return;
  }

  // User is signed in — load their access record from Firebase
  document.getElementById("user-email").textContent = user.email;
  document.getElementById("header-right").style.display = "";
  show("loading");

  try {
    // We store access control at: users/<uid>/access/<dashboard_key> = true/false
    const snap = await get(ref(db, `users/${user.uid}/access`));
    const access = snap.exists() ? snap.val() : {};
    renderHub(access);
  } catch (err) {
    console.error("Failed to load access record:", err);
    renderHub({});   // show no cards rather than crashing
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// Render the hub cards based on what this user can see
// ─────────────────────────────────────────────────────────────────────────────
function renderHub(access) {
  const grid = document.getElementById("cards-grid");
  grid.innerHTML = "";

  const visible = DASHBOARDS.filter(d => access[d.key] === true);

  if (visible.length === 0) {
    grid.innerHTML = `
      <div class="no-access" style="grid-column:1/-1">
        <h3>No dashboards yet</h3>
        <p>You don't have access to any dashboards. Contact Roy to get added.</p>
      </div>`;
    show("hub");
    return;
  }

  visible.forEach(d => {
    const card = document.createElement("a");
    card.className = "dash-card";
    card.href      = d.url;
    card.target    = "_blank";
    card.rel       = "noopener noreferrer";
    card.innerHTML = `
      <div class="card-accent ${d.accent}"></div>
      <div class="card-body">
        <span class="card-icon">${d.icon}</span>
        <div class="card-title">${d.title}</div>
        <div class="card-desc">${d.desc}</div>
      </div>
      <div class="card-footer">
        <span class="badge">${d.badge}</span>
        <span class="card-arrow">→</span>
      </div>`;
    grid.appendChild(card);
  });

  show("hub");
}

// ─────────────────────────────────────────────────────────────────────────────
// Sign-in form
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById("btn-signin").addEventListener("click", async () => {
  const email    = document.getElementById("email-input").value.trim();
  const password = document.getElementById("password-input").value;
  const errEl    = document.getElementById("sign-in-error");
  errEl.classList.remove("visible");

  if (!email || !password) {
    errEl.textContent = "Please enter your email and password.";
    errEl.classList.add("visible");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged fires automatically — no need to do anything here
  } catch (err) {
    const msgs = {
      "auth/user-not-found":   "No account found with that email.",
      "auth/wrong-password":   "Incorrect password.",
      "auth/invalid-email":    "Please enter a valid email address.",
      "auth/too-many-requests":"Too many attempts. Try again later.",
      "auth/invalid-credential": "Email or password is incorrect."
    };
    errEl.textContent = msgs[err.code] || "Sign-in failed. Please try again.";
    errEl.classList.add("visible");
  }
});

// Allow Enter key in password field to submit
document.getElementById("password-input").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn-signin").click();
});

// ─────────────────────────────────────────────────────────────────────────────
// Forgot password — toggle reset view
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById("forgot-link").addEventListener("click", () => {
  document.getElementById("reset-view").classList.add("visible");
  document.getElementById("forgot-link").style.display = "none";
  document.getElementById("sign-in-error").classList.remove("visible");
  // Pre-fill reset email if user already typed one
  const typedEmail = document.getElementById("email-input").value.trim();
  if (typedEmail) document.getElementById("reset-email").value = typedEmail;
});

document.getElementById("back-to-signin").addEventListener("click", () => {
  document.getElementById("reset-view").classList.remove("visible");
  document.getElementById("forgot-link").style.display = "";
  document.getElementById("reset-msg").textContent = "";
  document.getElementById("reset-msg").className = "reset-msg";
});

document.getElementById("btn-send-reset").addEventListener("click", async () => {
  const email  = document.getElementById("reset-email").value.trim();
  const msgEl  = document.getElementById("reset-msg");
  msgEl.textContent = "";
  msgEl.className   = "reset-msg";

  if (!email) {
    msgEl.textContent = "Please enter your email address.";
    msgEl.classList.add("error");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    msgEl.textContent = "✓ Reset link sent! Check your inbox (and spam folder).";
    msgEl.classList.add("success");
    document.getElementById("btn-send-reset").disabled = true;
  } catch (err) {
    const msgs = {
      "auth/user-not-found": "No account found with that email.",
      "auth/invalid-email":  "Please enter a valid email address.",
      "auth/too-many-requests": "Too many attempts. Try again later."
    };
    msgEl.textContent = msgs[err.code] || "Something went wrong. Try again.";
    msgEl.classList.add("error");
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// Sign-out
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById("btn-signout").addEventListener("click", () => {
  signOut(auth);
});
</script>
</body>
</html>
